name: mesh-llm lab release

# Builds the mesh-llm lab build's native tarballs for the Devcon 8 workshop on native runners, with
# mesh-llm's own release recipes and nothing else: `just release-build` (`release-build-aarch64` on
# Linux arm64), then `just release-bundle <version>`. It uploads each tarball and its .sha256 to
# this repository's pre-release, replacing assets of the same name. The bytes are not reproducible
# across builds, so a tarball's sha256 comes from the run that built it; the recipe and the commit
# are what reproduce the build.
#
# Targets are the ones mesh-llm itself supports natively: Linux x86_64, Linux aarch64, macOS arm64.

on:
  # A pull request that changes this file builds all three targets with the defaults below and
  # uploads nothing; only a manual run publishes.
  pull_request:
    paths: [.github/workflows/mesh-llm-lab-release.yml]
  workflow_dispatch:
    inputs:
      mesh_repo:
        description: Repository holding the lab commit
        default: ethanyzhang/mesh-llm
      mesh_commit:
        description: Full commit SHA of the lab build
        default: 3ffa5c4f1d7d162c964fc7fb24937c7ed5a12301
      version:
        description: Version the binary reports (release-bundle checks it)
        default: v0.78.0
      release_tag:
        description: Pre-release in this repository to upload to
        default: mesh-llm-lab-3ffa5c4f1

permissions:
  contents: read

concurrency:
  group: mesh-llm-lab-release-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            recipe: release-build
            target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            recipe: release-build-aarch64
            target: aarch64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-15
            recipe: release-build
            target: aarch64-apple-darwin
    env:
      MESH_REPO: ${{ inputs.mesh_repo || 'ethanyzhang/mesh-llm' }}
      MESH_COMMIT: ${{ inputs.mesh_commit || '3ffa5c4f1d7d162c964fc7fb24937c7ed5a12301' }}
      VERSION: ${{ inputs.version || 'v0.78.0' }}
      RECIPE: ${{ matrix.recipe }}
      TARGET: ${{ matrix.target }}
      DO_NOT_TRACK: "1"
    steps:
      - name: Check inputs
        run: |
          [[ "$MESH_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "mesh_commit must be a full 40-hex SHA"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v0.78.0"; exit 1; }
          [[ "$MESH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "mesh_repo must be owner/name"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.mesh_repo || 'ethanyzhang/mesh-llm' }}
          ref: ${{ inputs.mesh_commit || '3ffa5c4f1d7d162c964fc7fb24937c7ed5a12301' }}
          persist-credentials: false
          submodules: recursive

      # mesh-llm sits at the workspace root, as in its own CI, so its composite actions and scripts
      # find their paths. This workflow needs nothing from this repository.
      - name: The checkout is exactly the requested commit, with no changes
        run: |
          [ "$(git rev-parse HEAD)" = "$MESH_COMMIT" ] || { echo "HEAD is $(git rev-parse HEAD), not $MESH_COMMIT"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { git status --porcelain; exit 1; }

      # The same toolchain steps mesh-llm's release workflow uses at this commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: pnpm from mesh-llm-ui's packageManager
        run: corepack enable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
      - uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just
        with:
          tool: just

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev curl mold lld patchelf
          scripts/install-sccache.sh
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: macOS linker and sccache
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos-lld

      - name: just ${{ matrix.recipe }}
        run: just "$RECIPE"

      - name: just release-bundle
        run: just release-bundle "$VERSION" "$RUNNER_TEMP/out"

      - name: Check the tarball
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          f=mesh-llm-$TARGET.tar.gz
          [ -f "$f" ] && [ -f "$f.sha256" ] || { ls -la; exit 1; }
          if command -v sha256sum >/dev/null; then sha256sum -c "$f.sha256"; else shasum -a 256 -c "$f.sha256"; fi
          mkdir -p x && tar -xzf "$f" -C x
          for m in product-manifest.json host-imports.json mesh-llm native-runtimes; do [ -e "x/mesh-bundle/$m" ] || { echo "missing mesh-bundle/$m"; exit 1; }; done
          got=$(HOME="$RUNNER_TEMP/h" x/mesh-bundle/mesh-llm --version 2>/dev/null | tail -1)
          [ "$got" = "mesh-llm ${VERSION#v}" ] || { echo "binary reports '$got'"; exit 1; }
          if command -v sha256sum >/dev/null; then b=$(sha256sum x/mesh-bundle/mesh-llm | cut -d' ' -f1); else b=$(shasum -a 256 x/mesh-bundle/mesh-llm | cut -d' ' -f1); fi
          echo "### $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "tarball $(cut -d' ' -f1 "$f.sha256"), binary $b, built from $MESH_REPO@$MESH_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mesh-llm-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/out/mesh-llm-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/out/mesh-llm-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Upload to the pre-release, replacing assets of the same name
        run: |
          set -euo pipefail
          cd out && sha256sum -c ./*.sha256
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease | grep -qx true || { echo "$TAG is not a pre-release"; exit 1; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*.tar.gz ./*.tar.gz.sha256
          echo "### Uploaded to $TAG" >> "$GITHUB_STEP_SUMMARY"
          cat ./*.sha256 >> "$GITHUB_STEP_SUMMARY"
