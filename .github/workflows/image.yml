name: image

# Builds the participant image natively for each architecture from versions.lock, runs the secret
# scan (with its negative test) and the smoke tests. On main the `publish` job then pushes an immutable
# tag per architecture plus a multi-arch manifest list, which a moving `latest` tag also points at:
#   ghcr.io/action-state-group/devcon-workshop:YYYYMMDD-ml<lab commit>-cap<capsules version>-b<build>.<run>
# `publish` runs under the `image-release` environment and waits for a reviewer's approval, so a
# push to main alone publishes nothing and never moves `latest`.
#
# Pull requests run only `unit` (asg-agent-team-ethan#409): actionlint on every workflow and the unit
# tests, the same `scripts/check.sh --unit` the local check runs. The two image builds and the in-image
# tests after them run on push to main when an input of the image changed (the `paths:` list below)
# and on a manual dispatch; no pull request and no local check before a push builds the image
# (CONTRIBUTING.md, #110). With the build cache warm they take about 15 to 25 minutes; a bump of a
# Rust source pin recompiles that stage. There is no nightly:
# PUBLISH and `publish` accept any non-PR event on main, so a schedule would ask to publish. A red
# main run, pushed or manual, opens or comments on one `ci-red` issue (`report-failure`).

on:
  pull_request:
  push:
    branches: [main]
    # Everything the Dockerfile copies or the jobs below read. Only WORKSHOP.md, docs/, studio/ (its
    # own workflow) and the other workflows are left out.
    paths:
      - .github/workflows/image.yml
      - .github/scripts/report-failure.sh
      - Dockerfile
      - .dockerignore
      - versions.lock
      - package.json
      - package-lock.json
      - README.md
      - agent/**
      - bin/**
      - build/**
      - demos/**
      - examples/**
      - lib/**
      - patches/**
      - scripts/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A main run parked on the publish approval must not hold back later pushes: only PR runs share a group.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/action-state-group/devcon-workshop
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The shellcheck call and the python and bash unit tests: the unit tier of the local check.
      - name: unit (scripts/check.sh --unit)
        run: scripts/check.sh --unit

  meta:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag (one value for both architectures)
        id: tag
        run: |
          . ./versions.lock
          tag="$(date -u +%Y%m%d)-ml${MESH_LLM_SHA:0:7}-cap${CAPSULES_VERSION}-b${GITHUB_SHA:0:7}.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag: $tag"

  build:
    needs: [unit, meta]
    # Never on a pull request (see the top of this file).
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (the Rust builds and a 3+ GB image do not fit the default runner disk)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/local/julia* /usr/lib/jvm /usr/share/miniconda /usr/lib/google-cloud-sdk \
            /opt/microsoft /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null
          # BuildKit's cache, the exported tarball and the imported image all live under Docker's data root.
          # Some amd64 runners have a 72 GB root disk with 34 GB free after the removals above (run 41746304076
          # filled it at `importing to docker`); the build peaks at about 45 GB. When a separate /mnt disk of
          # 40 GB or more exists, keep Docker's data there. Larger-disk runners (145 GB) skip this.
          mnt_gb=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          if mountpoint -q /mnt && [ "${mnt_gb:-0}" -ge 40 ]; then
            # Bind mounts cover both image stores (/var/lib/docker, and /var/lib/containerd with the
            # containerd snapshotter) and leave the runner's daemon.json alone.
            sudo systemctl stop docker docker.socket containerd
            sudo mkdir -p /mnt/docker /mnt/containerd /var/lib/docker /var/lib/containerd
            sudo mount --bind /mnt/docker /var/lib/docker
            sudo mount --bind /mnt/containerd /var/lib/containerd
            sudo systemctl start containerd docker
            docker info --format 'docker root: {{.DockerRootDir}} ({{.Driver}})'
            findmnt -n -M /var/lib/docker
            findmnt -n -M /var/lib/containerd
          fi
          df -h / /mnt

      - name: Pins for the image labels
        id: lock
        run: grep -E '^(MESH_LLM_SHA|CAPSULES_COMMIT|CAPSULES_VERSION|LEXE_VERSION|LEXE_COMMIT)=' versions.lock >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: devcon-workshop:ci
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            MESH_LLM_SHA=${{ steps.lock.outputs.MESH_LLM_SHA }}
            CAPSULES_COMMIT=${{ steps.lock.outputs.CAPSULES_COMMIT }}
            CAPSULES_VERSION=${{ steps.lock.outputs.CAPSULES_VERSION }}
            LEXE_VERSION=${{ steps.lock.outputs.LEXE_VERSION }}
            LEXE_COMMIT=${{ steps.lock.outputs.LEXE_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Disk after the build
        run: df -h / /mnt

      # The size check, the secret scan with its negative test, the in-image tests, the console relay and
      # S08 (bounded at 45 minutes). The local check's image tier runs the same code on arm64.
      - name: Image tests (scripts/check.sh --image-tests)
        run: scripts/check.sh --image-tests devcon-workshop:ci

      # Nothing is published from here: the tested image is handed to the `publish` job, which waits
      # for approval. The same bytes that passed the tests above are what gets pushed.
      - name: Save the tested image for the publish job
        if: env.PUBLISH == 'true'
        run: |
          docker tag devcon-workshop:ci devcon-workshop:ci-${{ matrix.arch }}
          docker save devcon-workshop:ci-${{ matrix.arch }} | gzip -1 > "$RUNNER_TEMP/image-${{ matrix.arch }}.tar.gz"
      - name: Upload the tested image
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar.gz
          retention-days: 14
          compression-level: 0

  # The only job that writes to ghcr.io. It runs under the `image-release` environment, which has
  # required reviewers: a push to main builds and tests but publishes nothing until a reviewer
  # approves this job. `latest` moves only here (see "Publishing the image" in README.md).
  publish:
    needs: [meta, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: image-release
    concurrency:
      group: image-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Push the per-architecture tags and the multi-arch manifest list
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${{ needs.meta.outputs.tag }}"
          if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then echo "$IMAGE:$tag already exists"; exit 1; fi
          # Load and check both images before pushing anything, so a bad artifact leaves nothing half-published.
          for arch in amd64 arm64; do
            gzip -dc "$RUNNER_TEMP/images/image-$arch.tar.gz" | docker load
            rm -f "$RUNNER_TEMP/images/image-$arch.tar.gz"
            got=$(docker image inspect "devcon-workshop:ci-$arch" --format '{{.Architecture}}')
            [ "$got" = "$arch" ] || { echo "devcon-workshop:ci-$arch is $got"; exit 1; }
          done
          # A per-arch tag left by an earlier attempt of this same run was pushed after that attempt's tests passed,
          # so a re-run skips it and finishes the manifest; only the multi-arch tag means "published".
          for arch in amd64 arm64; do
            ref="$IMAGE:$tag-$arch"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then echo "$ref already pushed"; continue; fi
            docker tag "devcon-workshop:ci-$arch" "$ref"
            docker push "$ref"
          done
          # `latest` moves only on an approved publish; the immutable tag and its digest stay the reproducible reference.
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
          docker buildx imagetools inspect "$IMAGE:$tag" | tee /tmp/inspect
          { echo "### $IMAGE:$tag"; echo '```'; cat /tmp/inspect; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # A red main run (a push or a manual run on main) reaches a person the same day: it opens or comments
  # on one `ci-red` issue. It does not wait for `publish`, which parks on a reviewer's approval. A
  # cancelled run is not reported.
  report-failure:
    name: report a red main run
    needs: [unit, meta, build]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Report on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "image failed on main"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.CI_FAILURE_ASSIGNEE }}
        run: bash .github/scripts/report-failure.sh
