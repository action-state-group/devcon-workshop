name: image

# Builds the participant image natively for each architecture from versions.lock, runs the secret
# scan (with its negative test) and the smoke tests. On main the `publish` job then pushes an immutable
# tag per architecture plus a multi-arch manifest list, which a moving `latest` tag also points at:
#   ghcr.io/action-state-group/devcon-workshop:YYYYMMDD-ml<lab commit>-cap<capsules version>-b<build>.<run>
# `publish` runs under the `image-release` environment and waits for a reviewer's approval, so a
# push to main alone publishes nothing and never moves `latest`. Pull requests build and test only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A main run parked on the publish approval must not hold back later pushes: only PR runs share a group.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/action-state-group/devcon-workshop
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -e SC1091 bin/devcon8 bin/devcon8-entry lib/*.sh agent/bin/pay-x402 tests/smoke.sh tests/goose-approve.sh tests/sim-payment.sh tests/s08-ci.sh tests/mbx-net.sh tests/test_nanda.sh tests/test_trade_protocol.sh tests/sim-buyer.sh tests/sim-lightning.sh tests/recipe-prompt.sh build/fetch.sh build/usb.sh
      - name: mbx unit tests
        run: python3 -I tests/test_mbx.py
      - name: lightning unit tests (fake wallet API, no money moves)
        run: python3 -I tests/test_lightning.py
      - name: nanda against a fake gateway
        run: bash tests/test_nanda.sh
      - name: trade messages against a fake gateway with the real conversation rule
        run: bash tests/test_trade_protocol.sh

  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The two image builds take about 80 minutes each. A pull request that changes only docs (README.md,
      # WORKSHOP.md, docs/) skips them: the README is copied into the image but no test reads it, and the
      # push to main that follows always builds. Anything else, including demos/**.md, still builds.
      - name: Does this change need an image build?
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          build=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            echo "$files"
            if ! echo "$files" | grep -qv -E '^(README\.md|WORKSHOP\.md|docs/.*)$'; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build: $build"
      - name: Tag (one value for both architectures)
        id: tag
        run: |
          . ./versions.lock
          tag="$(date -u +%Y%m%d)-ml${MESH_LLM_SHA:0:7}-cap${CAPSULES_VERSION}-b${GITHUB_SHA:0:7}.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag: $tag"

  build:
    needs: [unit, meta]
    if: needs.meta.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (the Rust builds and a 3+ GB image do not fit the default runner disk)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          # BuildKit's cache, the exported tarball and the imported image all live under Docker's data root.
          # The amd64 runner's root disk had 34 GB free after the removals above and filled at `importing to
          # docker`; its separate /mnt disk adds about 60 GB, so keep Docker's data there when it is large enough.
          mnt_gb=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          if mountpoint -q /mnt && [ "${mnt_gb:-0}" -ge 40 ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl start docker
            docker info --format 'docker root: {{.DockerRootDir}}'
          fi
          df -h / /mnt

      - name: Pins for the image labels
        id: lock
        run: grep -E '^(MESH_LLM_SHA|CAPSULES_COMMIT|CAPSULES_VERSION|LEXE_VERSION|LEXE_COMMIT)=' versions.lock >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: devcon-workshop:ci
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            MESH_LLM_SHA=${{ steps.lock.outputs.MESH_LLM_SHA }}
            CAPSULES_COMMIT=${{ steps.lock.outputs.CAPSULES_COMMIT }}
            CAPSULES_VERSION=${{ steps.lock.outputs.CAPSULES_VERSION }}
            LEXE_VERSION=${{ steps.lock.outputs.LEXE_VERSION }}
            LEXE_COMMIT=${{ steps.lock.outputs.LEXE_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Size
        run: |
          df -h / /mnt
          bytes=$(docker image inspect devcon-workshop:ci --format '{{.Size}}')
          echo "uncompressed: $(( bytes / 1024 / 1024 )) MiB"
          # Reviewed 2026-10-31 at 3.3 GiB (design section 4 asks for review over 3 GB): models 1.1G, the
          # agent CLIs 0.7G after shipping each once, goose 0.2G, Go 0.3G plus go-seal's vendored modules
          # 0.14G, mesh-llm and plugins 0.2G. S08 now shares the host build. Anything beyond this needs review.
          [ "$bytes" -le $(( 3584 * 1024 * 1024 )) ] || { echo "over 3.5 GiB: review before shipping"; exit 1; }

      - name: Secret scan (negative test first, then the image)
        run: |
          for neg in Dockerfile env.Dockerfile key.Dockerfile; do
            docker build -q -t dw-scan-neg -f "tests/secret-scan/$neg" tests/secret-scan
            docker save dw-scan-neg -o /tmp/neg.tar
            if python3 -I build/secret-scan.py /tmp/neg.tar; then echo "the scanner missed the secret in $neg"; exit 1; fi
          done
          docker save devcon-workshop:ci -o /tmp/image.tar
          python3 -I build/secret-scan.py /tmp/image.tar
          rm -f /tmp/image.tar /tmp/neg.tar

      - name: Smoke tests
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/smoke.sh
      - name: goose approve mode shows each card once (patched goose, mock ACP agent)
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/goose-approve.sh

      - name: The trader reaches the NANDA Index (no Cloudflare 403)
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/mbx-net.sh

      - name: Simulated payment seals on a test network
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/sim-payment.sh

      - name: The buyer's pay is checked with the shop as payee
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/sim-buyer.sh

      - name: Lightning payment against a fake wallet (caps, paused pay, payment_received, no preimage kept)
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/sim-lightning.sh

      - name: The recipe's protocol reaches the model, in the right payment mode (both modes rendered; sent through claude-acp)
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/recipe-prompt.sh

      - name: The published console port serves the management routes (the relay)
        run: |
          id=$(docker run -d -p 127.0.0.1:3141:3132 devcon-workshop:ci /opt/devcon8/tests/console-relay-serve.sh)
          code=000
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://127.0.0.1:3141/api/plugins || true)
            [ "$code" = 200 ] && break; sleep 2
          done
          [ "$code" = 200 ] || { docker logs "$id"; docker exec "$id" sh -c 'cat /tmp/dw-*/run.log /tmp/dw-*/.devcon8/relay.log' || true; }
          docker rm -f "$id" >/dev/null
          [ "$code" = 200 ] || { echo "/api/plugins through the published port: HTTP $code"; exit 1; }

      - name: S08 in the container (start, console through the published port, lie, twins, referee, stop)
        timeout-minutes: 45
        run: |
          id=$(docker run -d -e S08_CI_HOLD=1 -p 127.0.0.1:9614:9624 devcon-workshop:ci /opt/devcon8/tests/s08-ci.sh)
          until docker exec "$id" test -e /tmp/s08-started 2>/dev/null; do
            [ "$(docker inspect -f '{{.State.Running}}' "$id")" = true ] || { docker logs "$id"; exit 1; }
            sleep 5
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:9614/api/plugins || true)
          docker exec "$id" touch /tmp/s08-continue
          rc=$(docker wait "$id"); docker logs "$id"; docker rm "$id" >/dev/null
          [ "$code" = 200 ] || { echo "s08 asker /api/plugins through the published port: HTTP $code"; exit 1; }
          [ "$rc" = 0 ] || { echo "s08-ci exited $rc"; exit 1; }

      # Nothing is published from here: the tested image is handed to the `publish` job, which waits
      # for approval. The same bytes that passed the tests above are what gets pushed.
      - name: Save the tested image for the publish job
        if: env.PUBLISH == 'true'
        run: |
          docker tag devcon-workshop:ci devcon-workshop:ci-${{ matrix.arch }}
          docker save devcon-workshop:ci-${{ matrix.arch }} | gzip -1 > "$RUNNER_TEMP/image-${{ matrix.arch }}.tar.gz"
      - name: Upload the tested image
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar.gz
          retention-days: 14
          compression-level: 0

  # The only job that writes to ghcr.io. It runs under the `image-release` environment, which has
  # required reviewers: a push to main builds and tests but publishes nothing until a reviewer
  # approves this job. `latest` moves only here (see "Publishing the image" in README.md).
  publish:
    needs: [meta, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: image-release
    concurrency:
      group: image-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Push the per-architecture tags and the multi-arch manifest list
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${{ needs.meta.outputs.tag }}"
          if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then echo "$IMAGE:$tag already exists"; exit 1; fi
          # Load and check both images before pushing anything, so a bad artifact leaves nothing half-published.
          for arch in amd64 arm64; do
            gzip -dc "$RUNNER_TEMP/images/image-$arch.tar.gz" | docker load
            rm -f "$RUNNER_TEMP/images/image-$arch.tar.gz"
            got=$(docker image inspect "devcon-workshop:ci-$arch" --format '{{.Architecture}}')
            [ "$got" = "$arch" ] || { echo "devcon-workshop:ci-$arch is $got"; exit 1; }
          done
          # A per-arch tag left by an earlier attempt of this same run was pushed after that attempt's tests passed,
          # so a re-run skips it and finishes the manifest; only the multi-arch tag means "published".
          for arch in amd64 arm64; do
            ref="$IMAGE:$tag-$arch"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then echo "$ref already pushed"; continue; fi
            docker tag "devcon-workshop:ci-$arch" "$ref"
            docker push "$ref"
          done
          # `latest` moves only on an approved publish; the immutable tag and its digest stay the reproducible reference.
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
          docker buildx imagetools inspect "$IMAGE:$tag" | tee /tmp/inspect
          echo "### $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/inspect >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
