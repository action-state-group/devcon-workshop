name: image

# Builds the participant image natively for each architecture from versions.lock, runs the secret
# scan (with its negative test) and the smoke tests, and on main publishes an immutable tag per
# architecture plus a multi-arch manifest list:
#   ghcr.io/action-state-group/devcon-workshop:YYYYMMDD-ml<lab commit>-cap<capsules version>-b<build>.<run>
# Pull requests build and test only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/action-state-group/devcon-workshop
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -e SC1091 bin/devcon8 bin/devcon8-entry lib/*.sh agent/bin/pay-x402 tests/smoke.sh tests/sim-payment.sh tests/s08-ci.sh tests/mbx-net.sh tests/test_nanda.sh tests/test_trade_protocol.sh tests/sim-buyer.sh tests/sim-lightning.sh build/fetch.sh build/usb.sh
      - name: mbx unit tests
        run: python3 -I tests/test_mbx.py
      - name: lightning unit tests (fake wallet API, no money moves)
        run: python3 -I tests/test_lightning.py
      - name: nanda against a fake gateway
        run: bash tests/test_nanda.sh
      - name: trade messages against a fake gateway with the real conversation rule
        run: bash tests/test_trade_protocol.sh

  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag (one value for both architectures)
        id: tag
        run: |
          . ./versions.lock
          tag="$(date -u +%Y%m%d)-ml${MESH_LLM_SHA:0:7}-cap${CAPSULES_VERSION}-b${GITHUB_SHA:0:7}.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag: $tag"

  build:
    needs: [unit, meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (the Rust builds and a 2.5 GB image do not fit the default runner disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Pins for the image labels
        id: lock
        run: grep -E '^(MESH_LLM_SHA|CAPSULES_COMMIT|CAPSULES_VERSION|LEXE_VERSION|LEXE_COMMIT)=' versions.lock >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: devcon-workshop:ci
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            MESH_LLM_SHA=${{ steps.lock.outputs.MESH_LLM_SHA }}
            CAPSULES_COMMIT=${{ steps.lock.outputs.CAPSULES_COMMIT }}
            CAPSULES_VERSION=${{ steps.lock.outputs.CAPSULES_VERSION }}
            LEXE_VERSION=${{ steps.lock.outputs.LEXE_VERSION }}
            LEXE_COMMIT=${{ steps.lock.outputs.LEXE_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Size
        run: |
          bytes=$(docker image inspect devcon-workshop:ci --format '{{.Size}}')
          echo "uncompressed: $(( bytes / 1024 / 1024 )) MiB"
          # Reviewed 2026-10-31 at 3.3 GiB (design section 4 asks for review over 3 GB): models 1.1G, the
          # agent CLIs 0.7G after shipping each once, goose 0.2G, Go 0.3G plus go-seal's vendored modules
          # 0.14G, mesh-llm and plugins 0.2G. S08 now shares the host build. Anything beyond this needs review.
          [ "$bytes" -le $(( 3584 * 1024 * 1024 )) ] || { echo "over 3.5 GiB: review before shipping"; exit 1; }

      - name: Secret scan (negative test first, then the image)
        run: |
          for neg in Dockerfile env.Dockerfile key.Dockerfile; do
            docker build -q -t dw-scan-neg -f "tests/secret-scan/$neg" tests/secret-scan
            docker save dw-scan-neg -o /tmp/neg.tar
            if python3 -I build/secret-scan.py /tmp/neg.tar; then echo "the scanner missed the secret in $neg"; exit 1; fi
          done
          docker save devcon-workshop:ci -o /tmp/image.tar
          python3 -I build/secret-scan.py /tmp/image.tar
          rm -f /tmp/image.tar /tmp/neg.tar

      - name: Smoke tests
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/smoke.sh

      - name: The trader reaches the NANDA Index (no Cloudflare 403)
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/mbx-net.sh

      - name: Simulated payment seals on a test network
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/sim-payment.sh

      - name: The buyer's pay is checked with the shop as payee
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/sim-buyer.sh

      - name: Lightning payment against a fake wallet (caps, paused pay, payment_received, no preimage kept)
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/sim-lightning.sh

      - name: S08 in the container (start, lie, twins, referee, stop)
        timeout-minutes: 45
        run: docker run --rm devcon-workshop:ci /opt/devcon8/tests/s08-ci.sh

      - name: Push the per-architecture tag
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$IMAGE:${{ needs.meta.outputs.tag }}-${{ matrix.arch }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then echo "$ref already exists"; exit 1; fi
          docker tag devcon-workshop:ci "$ref"
          docker push "$ref"

  manifest:
    needs: [meta, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Multi-arch manifest list
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${{ needs.meta.outputs.tag }}"
          if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then echo "$IMAGE:$tag already exists"; exit 1; fi
          docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
          docker buildx imagetools inspect "$IMAGE:$tag" | tee /tmp/inspect
          echo "### $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/inspect >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
