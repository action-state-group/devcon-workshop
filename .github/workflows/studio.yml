name: studio

# The Terms Pack Studio layer's own checks (studio/README.md). Separate from image.yml: the layer is
# an internal build on top of the published image and never touches its build, tags or publish gate.
# The recipe test pulls the published image to render studio.yaml with its goose; it pushes nothing.

on:
  pull_request:
    paths:
      - studio/**
      - agent/bin/mbx
      - agent/bin/offers
      - lib/trade.sh
      - bin/devcon8
      - agent/recipes/**
      - tests/studio-*
      - tests/test_build_recipe.py
      - scripts/check.sh
      - .github/workflows/studio.yml

permissions:
  contents: read

# Both jobs run the steps in scripts/check.sh, which the local check before a push also runs when a
# path above changed (its `studio_path` list, kept in step with this one).
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck, the generated recipe, and the recipe render on the pinned base
        run: scripts/check.sh --studio-unit

  # The layer itself, on the pinned base: build it, check its contents, then run demo steps 1-6 without a
  # model against a replay of ten sticker trades. Built locally in the job; nothing is pushed.
  layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: build the layer and run demo steps 1-6 in it
        run: scripts/check.sh --studio-layer
