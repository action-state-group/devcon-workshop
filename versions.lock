# s08-liar is company-internal-all devcon8/s08-liar at e80b9fa55832311482c4219bd06e62c74060c8f8 (#50),
# with the edits made here (S08_LISTEN_ALL, the build note, the Evidence-page hint, the pins in env.sh). It runs all four nodes on the mesh-llm and capsules above.
# The liar's plugin is the capsules above plus demos/s08-liar/redteam/selective-log.patch, built here
# from CAPSULES_COMMIT; step 8's reconcile tool is built from demos/s08-liar/reconcile (its go.mod
# pins evidencebook v0.12.2).
# lexe-wallet plugin: built here from the settled-preimage branch (Mesh-LLM/lexe-wallet-plugin#7,
# feat/settled-preimage), which reports a succeeded payment's preimage; it pins the mesh-llm fork
# crates in its Cargo.toml. Compare by commit, not sha256. The packaged version stays v0.1.0.
LEXE_VERSION=v0.1.0
LEXE_REPO=https://github.com/ethanyzhang/lexe-wallet-plugin
LEXE_COMMIT=9f830c181b4042a81069df50752cf19d035a5047

# capsulectl, the deal plugin and the book plugin: the paired rc36 releases (capsule-cli
# v0.1.0-rc36, evidencebook-deal v0.1.0-rc36, evidencebook tag capsulectl/v0.1.0-rc36; the plugins' handshake
# core_version must equal the core's). Since rc29 the deal plugin seals a Lightning payment_received with its preimage (evidencebook-deal#90, on evidencebook
# v0.12.1), which `devcon8 trade --pay lexe` needs; it carries `deal terms-leg` (evidencebook-deal#70). Since rc33 a Lightning
# deal's receipt reads in msat (terms currency BTC, amount_minor in msat: evidencebook-deal#133). Since rc34 (evidencebook v0.13.5)
# `deal standard-history card` prices such a deal as BTC at assetScale 11 instead of refusing it (evidencebook#388). Since rc35 the book plugin's History card module is capsule-viewer 0.18.2
# (the "Everything on the card" fold-out has a gap under the card: capsule-viewer#283). Since rc36 the deal plugin seals a dispute and a ruling (`deal note --kind dispute|ruling`, evidencebook-deal#151) and the History card's disputes tally reads them.
CAPSULECTL_VERSION=v0.1.0-rc36
