# capsulectl, the deal plugin and the book plugin: the paired rc45 releases (capsule-cli v0.1.0-rc45, evidencebook-deal
# v0.1.0-rc45, evidencebook tag capsulectl/v0.1.0-rc45; the plugins' handshake core_version must equal the core's; the same set the Muse plugin
# pins). Moved from rc37 to run the rules checker below (the checker's input and result schemas are evidencebook's at rc45). What each rc added up to rc37: since rc29 the deal plugin seals a Lightning payment_received with its preimage (evidencebook-deal#90, on evidencebook
# v0.12.1), which `devcon8 trade --pay lexe` needs; it carries `deal terms-leg` (evidencebook-deal#70). Since rc33 a Lightning
# deal's receipt reads in msat (terms currency BTC, amount_minor in msat: evidencebook-deal#133). Since rc34 (evidencebook v0.13.5)
# `deal standard-history card` prices such a deal as BTC at assetScale 11 instead of refusing it (evidencebook#388). Since rc35 the book plugin's History card module is capsule-viewer 0.18.2
# (the "Everything on the card" fold-out has a gap under the card: capsule-viewer#283). Since rc36 the deal plugin seals a dispute and a ruling (`deal note --kind dispute|ruling`, evidencebook-deal#151) and the History card's disputes tally reads them. Since rc37 the deal card names a terms pack's row in the pack's words (evidencebook-deal#158) and the book plugin's History card module is capsule-viewer 0.18.3 (rounded PRIVATE notice, gap under the checks line: capsule-viewer#298).
CAPSULECTL_VERSION=v0.1.0-rc45
CAPSULECTL_SHA256_AMD64=663f9087e6913b8fba26ee1258c0030cde22a71df5bd2844e28c5979d6e42a7b
