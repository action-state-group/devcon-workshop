# versions.lock: every component the image ships, pinned by commit or by release asset sha256.
# Sourced by build/fetch.sh and the Dockerfile's build stages; the build fails when a checksum differs.
# Per-architecture values end in _AMD64 or _ARM64.

# mesh-llm: the newest lab build (Ethan, 2026-10-31: "所有全部都用最新 lab"): 1aba71da6 =
# Mesh-LLM/mesh-llm main 000440ffa plus #2620, #2649, #2721 (9ef4c088c), #2741, #2744, #2748 and
# #2760 (0001688cd), one squashed commit per PR (branch lab/asg-2026-11-01 of the fork). Built here
# with the same just recipes as .github/workflows/mesh-llm-lab-release.yml, per architecture; compare
# by commit, not sha256.
MESH_LLM_REPO=https://github.com/ethanyzhang/mesh-llm
MESH_LLM_SHA=1aba71da6da562b259ad0696210d7fc7b932ac02
MESH_LLM_VERSION=0.78.0
JUST_VERSION=1.59.0
# capsules: release v0.1.15 (tag v0.1.15 = 3b35381: v0.1.14's shared History view and referee split-margin threshold setting, default 0, so the S08 referee rules contradicted:<liar>; plus capsules-plugin#261, the float-digest fix). The image never sets
# CAPSULES_ADMISSION_PROFILE, so #165's admission price rule stays off.
CAPSULES_COMMIT=3b3538179c50ca11c5266d6c0bb3aaca677d5fb3
CAPSULES_VERSION=0.1.15
CAPSULES_SHA256_AMD64=5bc4c3709b5870f1e6c6572632f5b88766696a148acafb76524910fdb0ce2f5f
CAPSULES_SHA256_ARM64=b8eb10b15b3b06b55ea6b7b51a38078a832fe168ca872eccb13d7c8c43e3e4e9
CAPSULES_REPO=https://github.com/Mesh-LLM/capsules-plugin
RUST_TOOLCHAIN=1.97.1

# s08-liar is company-internal-all devcon8/s08-liar at e80b9fa55832311482c4219bd06e62c74060c8f8 (#50),
# with the edits made here (S08_LISTEN_ALL, the build note, the Evidence-page hint, the pins in env.sh). It runs all four nodes on the mesh-llm and capsules above.
# The liar's plugin is the capsules above plus demos/s08-liar/redteam/selective-log.patch, built here
# from CAPSULES_COMMIT; step 8's reconcile tool is built from demos/s08-liar/reconcile (its go.mod
# pins evidencebook v0.12.2).
# lexe-wallet plugin: built here from the settled-preimage branch (Mesh-LLM/lexe-wallet-plugin#7,
# feat/settled-preimage), which reports a succeeded payment's preimage; it pins the mesh-llm fork
# crates in its Cargo.toml. Compare by commit, not sha256. The packaged version stays v0.1.0.
LEXE_VERSION=v0.1.0
LEXE_REPO=https://github.com/ethanyzhang/lexe-wallet-plugin
LEXE_COMMIT=9f830c181b4042a81069df50752cf19d035a5047

# capsulectl, the deal plugin and the book plugin: the paired rc33 releases (capsule-cli
# v0.1.0-rc33, evidencebook-deal v0.1.0-rc33, evidencebook tag capsulectl/v0.1.0-rc33; the plugins' handshake
# core_version must equal the core's). Since rc29 the deal plugin seals a Lightning payment_received with its preimage (evidencebook-deal#90, on evidencebook
# v0.12.1), which `devcon8 trade --pay lexe` needs; it carries `deal terms-leg` (evidencebook-deal#70). Since rc33 a Lightning
# deal's receipt reads in msat (terms currency BTC, amount_minor in msat: evidencebook-deal#133).
