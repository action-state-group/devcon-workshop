# The Studio layer's pins. Sourced by studio/build.sh and, inside the layer, by `terms`.
# Not part of the image's versions.lock: the layer is an internal build on top of a pinned image
# and is never published as `latest`.

# The workshop image the layer is built on: an immutable index digest, never `latest`.
# (v4 digest: filled in when the gated main run publishes it.)
STUDIO_BASE=

# The Terms Pack Studio scripts and the terms-pack-author skill: evidencebook-skills at a commit.
STUDIO_SKILLS_REPO=https://github.com/action-state-group/evidencebook-skills
STUDIO_SKILLS_COMMIT=
# Path of the `terms <verb>` entry point inside that checkout.
STUDIO_TERMS_ENTRY=
